name: Release Windows Desktop App

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.1.0-rc.1 or 0.1.0; defaults to VERSION file)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate release version
        id: meta
        shell: pwsh
        run: |
          $fileVersion = (Get-Content -Raw -Encoding UTF8 VERSION).Trim()
          if ("${{ github.event_name }}" -eq "push") {
            $tag = "${{ github.ref_name }}"
            if (-not $tag.StartsWith("v")) {
              throw "Tag '$tag' must start with 'v'."
            }
            $ver = $tag.Substring(1)
            if ($ver -ne $fileVersion) {
              throw "Git tag version '$ver' does not match VERSION file '$fileVersion'."
            }
          } else {
            $ver = "${{ github.event.inputs.version }}".Trim()
            if ([string]::IsNullOrWhiteSpace($ver)) {
              $ver = $fileVersion
            }
          }

          if ($ver -notmatch '^(\d+\.\d+\.\d+)(?:-rc\.([1-9]\d*))?$') {
            throw "Invalid version '$ver'. Expected X.Y.Z or X.Y.Z-rc.N."
          }

          $isPrerelease = if ($ver -match '-rc\.') { "true" } else { "false" }
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=v$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "prerelease=$isPrerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Wails CLI
        shell: pwsh
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y

      - name: Install frontend dependencies
        shell: pwsh
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run release build script
        shell: pwsh
        run: .\scripts\release.ps1 -Version "${{ steps.meta.outputs.version }}" -NoGit

      - name: Extract release notes from changelog.json
        shell: pwsh
        run: |
          $ver = "${{ steps.meta.outputs.version }}"
          $data = (Get-Content -Raw -Encoding UTF8 changelog.json) | ConvertFrom-Json
          $rel = $data.releases | Where-Object { $_.version -eq $ver } | Select-Object -First 1
          if ($null -eq $rel) {
            throw "Version '$ver' not found in changelog.json"
          }

          $typeMap = [ordered]@{
            breaking = "重大变更"
            feat     = "新增"
            perf     = "优化"
            fix      = "修复"
            change   = "变更"
          }

          $lines = New-Object System.Collections.Generic.List[string]
          if ($rel.title) { $lines.Add("## $($rel.title)"); $lines.Add("") }
          if ($rel.summary) { $lines.Add($rel.summary); $lines.Add("") }

          foreach ($k in $typeMap.Keys) {
            $items = @($rel.changes | Where-Object { $_.type -eq $k })
            if ($items.Count -gt 0) {
              $lines.Add("### $($typeMap[$k])")
              $lines.Add("")
              foreach ($item in $items) {
                $lines.Add("- $($item.text)")
              }
              $lines.Add("")
            }
          }

          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText("$PWD\release-notes.md", ($lines -join "`n").TrimEnd() + "`n", $utf8NoBom)

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Graviton-${{ steps.meta.outputs.tag }}-windows-amd64
          path: dist/${{ steps.meta.outputs.tag }}/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Graviton ${{ steps.meta.outputs.tag }}
          body_path: release-notes.md
          prerelease: ${{ steps.meta.outputs.prerelease }}
          files: dist/${{ steps.meta.outputs.tag }}/*
