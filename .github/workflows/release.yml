name: Release Windows Desktop App

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.1.0-rc.1 or 0.1.0; defaults to VERSION file)'
        required: false
        default: ''

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Resolve and validate release version
        id: meta
        shell: pwsh
        run: |
          $fileVersion = (Get-Content -Raw -Encoding UTF8 VERSION).Trim()
          if ("${{ github.event_name }}" -eq "push") {
            $tag = "${{ github.ref_name }}"
            if (-not $tag.StartsWith("v")) {
              throw "Tag '$tag' must start with 'v'."
            }
            $ver = $tag.Substring(1)
            if ($ver -ne $fileVersion) {
              throw "Git tag version '$ver' does not match VERSION file '$fileVersion'."
            }
          } else {
            $ver = "${{ github.event.inputs.version }}".Trim()
            if ([string]::IsNullOrWhiteSpace($ver)) {
              $ver = $fileVersion
            }
          }

          if ($ver -notmatch '^(\d+\.\d+\.\d+)(?:-rc\.([1-9]\d*))?$') {
            throw "Invalid version '$ver'. Expected X.Y.Z or X.Y.Z-rc.N."
          }

          $isPrerelease = if ($ver -match '-rc\.') { "true" } else { "false" }
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=v$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "prerelease=$isPrerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Wails CLI
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
          $goBin = Join-Path (go env GOPATH) "bin"
          if (Test-Path $goBin) {
            $goBin | Out-File -FilePath $env:GITHUB_PATH -Append
            $env:PATH = "$goBin;$env:PATH"
          }
          wails version

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          $nsisDir = "C:\Program Files (x86)\NSIS"
          if (Test-Path $nsisDir) {
            $nsisDir | Out-File -FilePath $env:GITHUB_PATH -Append
            $env:PATH = "$nsisDir;$env:PATH"
          }
          makensis /VERSION

      - name: Install frontend dependencies
        shell: pwsh
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run release build script
        shell: pwsh
        run: .\scripts\release.ps1 -Version "${{ steps.meta.outputs.version }}" -NoGit

      - name: Generate SLSA build provenance attestation
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/${{ steps.meta.outputs.tag }}/*.exe
            dist/${{ steps.meta.outputs.tag }}/SHA256SUMS.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Graviton-${{ steps.meta.outputs.tag }}-windows-amd64
          path: |
            dist/${{ steps.meta.outputs.tag }}/*.exe
            dist/${{ steps.meta.outputs.tag }}/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $distDir = "dist/$tag"
          $notesFile = Join-Path $distDir "RELEASE_NOTES.md"
          $checksumFile = Join-Path $distDir "SHA256SUMS.txt"
          $exeFiles = @(Get-ChildItem -Path $distDir -Filter "*.exe" | Sort-Object Name | ForEach-Object { $_.FullName })
          if ($exeFiles.Count -ne 2) {
            throw "Expected 2 .exe assets (installer + portable) in '$distDir', found $($exeFiles.Count)."
          }
          if (-not (Test-Path $checksumFile)) {
            throw "Missing checksum file '$checksumFile'."
          }
          if (-not (Test-Path $notesFile)) {
            throw "Missing release notes file '$notesFile'."
          }

          gh --version
          $ghArgs = @("release", "create", $tag)
          $ghArgs += $exeFiles
          $ghArgs += (Resolve-Path $checksumFile).Path
          $ghArgs += @(
            "--verify-tag",
            "--title", "Graviton $tag",
            "--notes-file", (Resolve-Path $notesFile).Path
          )
          if ("${{ steps.meta.outputs.prerelease }}" -eq "true") {
            $ghArgs += "--prerelease"
          }

          gh @ghArgs
          if ($LASTEXITCODE -ne 0) {
            throw "gh release create failed with exit code $LASTEXITCODE."
          }
